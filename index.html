<title>Карточки HSK 3.0</title>

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Onest:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap">
<style>
/* Layout: one column study desk — level tabs, a single large card, answer buttons under the thumb */
:root{
  --bg:#edf1ee; --surface:#fbfcfb; --ink:#17211d; --muted:#5d6b65; --line:#d3dcd7;
  --jade:#2c6b58; --jade-soft:#dbe9e2; --miss:#a64b3c; --miss-soft:#f3e1dc;
  --t1:#d23a2e; --t2:#2f8f45; --t3:#2a64c8; --t4:#8a3db8; --t5:#7a857f;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-py:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --ink:#e6ece9; --muted:#93a29b; --line:#2c3733;
  --jade:#6fbfa2; --jade-soft:#1f332c; --miss:#e08a78; --miss-soft:#3a2420; --t1:#ff6f61; --t2:#5ccf7a; --t3:#6ea4ff; --t4:#c58cf0; --t5:#9aa7a1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --ink:#e6ece9; --muted:#93a29b; --line:#2c3733;
  --jade:#6fbfa2; --jade-soft:#1f332c; --miss:#e08a78; --miss-soft:#3a2420; --t1:#ff6f61; --t2:#5ccf7a; --t3:#6ea4ff; --t4:#c58cf0; --t5:#9aa7a1; color-scheme:dark}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 span{font-family:var(--f-han);color:var(--jade);margin-right:6px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:8px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-size:15px;font-weight:600}
.tab small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.tab[aria-selected="true"] small{color:var(--surface);opacity:.85}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.spacer{flex:1}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--jade);width:0;transition:width .3s}
.stage{-webkit-perspective:1400px;perspective:1400px;flex:1;min-height:240px;display:flex}
.card{position:relative;flex:1;cursor:pointer;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform .45s cubic-bezier(.3,.7,.3,1);transition:transform .45s cubic-bezier(.3,.7,.3,1);outline:none;-webkit-user-select:none;user-select:none}
.card.flipped{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--jade)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;-webkit-transform:translateZ(1px);transform:translateZ(1px);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;box-sizing:border-box;text-align:center;gap:14px}
.back{-webkit-transform:rotateY(180deg) translateZ(1px);transform:rotateY(180deg) translateZ(1px)}
.corner{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.han{font-family:var(--f-han);font-weight:500;line-height:1.1;font-size:clamp(56px,18vw,104px);word-break:keep-all}
.han.long{font-size:clamp(40px,12vw,72px)}
.han.sm{font-size:clamp(32px,9vw,46px);font-weight:700}
.pic{font-size:clamp(40px,11vw,56px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.han ruby{ruby-position:over;-webkit-ruby-position:before}
.han rt{font-family:var(--f-py);font-style:italic;font-weight:400;font-size:max(13px,.27em);line-height:1.2;padding-bottom:.08em;letter-spacing:0}
.han .sep{color:var(--muted);font-size:.5em;margin:0 .25em;vertical-align:middle}
.legend{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:14px;font-family:var(--f-py);font-style:italic;font-size:15px}
.legend span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.legend small{font-family:var(--f-ui);font-style:normal;font-size:10px;color:var(--muted)}
.py{font-family:var(--f-py);font-style:italic;font-size:26px;color:var(--jade)}
.mean{font-size:17px;line-height:1.5;max-width:42ch;color:var(--ink);overflow-wrap:anywhere}
.mean.big{font-size:22px;font-weight:500}
.hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.lang{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{appearance:none;border:0;border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ans:disabled{opacity:.45;cursor:default}
.no{background:var(--miss-soft);color:var(--miss)}
.yes{background:var(--jade);color:var(--surface)}
.ans:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.done .han{font-size:64px;color:var(--jade)}
.done p{margin:0;color:var(--muted);max-width:36ch;line-height:1.5}
.keys{font-size:12px;color:var(--muted);text-align:center}
kbd{font-family:var(--f-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
@media (hover:none){.keys{display:none}}
@media (max-width:480px){.wrap{gap:12px;padding-block:12px 16px}h1{font-size:18px}.sub{display:none}.chip{padding:5px 10px}.ans{padding:14px}.face{padding:24px 16px}}
.card.noanim{-webkit-transition:none;transition:none}
@media (prefers-reduced-motion:reduce){.card,.fill{transition:none}}
/* ---------- Анимации ---------- */
html,body{overflow-x:hidden}
.mover{position:relative;flex:1;display:flex;will-change:transform}
.mover.snap{transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.mover.fly-yes,.mover.fly-no{transition:transform .32s cubic-bezier(.5,0,.9,.6),opacity .32s ease-in;opacity:0}
.mover.fly-yes{transform:translateX(130%) rotate(16deg)!important}
.mover.fly-no{transform:translateX(-130%) rotate(-16deg)!important}
.mover.enter{animation:enter .38s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{transform:translateY(22px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.stamp{position:absolute;top:26px;z-index:5;padding:4px 14px;border:3px solid;border-radius:10px;font-weight:700;font-size:20px;letter-spacing:.02em;opacity:0;pointer-events:none;background:var(--surface)}
.stamp-yes{left:22px;color:var(--jade);border-color:var(--jade);transform:rotate(-12deg)}
.stamp-no{right:22px;color:var(--miss);border-color:var(--miss);transform:rotate(12deg)}
.card{touch-action:pan-y}
/* иероглифы на обороте появляются по одному */
.card.flipped .back .han ruby{animation:rise .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 90ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.card.flipped .back .mean{animation:fadein .4s ease both;animation-delay:.45s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* картинки двигаются по смыслу */
.pic{display:inline-block;transform-origin:50% 80%}
.card.flipped .back .pic,.front .pic{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.card.flipped .back .pic.a-bounce,.front .pic.a-bounce{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,bounce 1.3s ease-in-out .6s infinite}
.card.flipped .back .pic.a-sway,.front .pic.a-sway{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,sway 2.6s ease-in-out .6s infinite}
.card.flipped .back .pic.a-float,.front .pic.a-float{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,float 3s ease-in-out .6s infinite}
.card.flipped .back .pic.a-fly,.front .pic.a-fly{animation:flyin .9s cubic-bezier(.2,.8,.3,1) both,hover 2.2s ease-in-out .9s infinite}
.card.flipped .back .pic.a-drive,.front .pic.a-drive{animation:drivein .8s cubic-bezier(.2,.8,.3,1) both,rumble .9s ease-in-out .8s infinite}
.card.flipped .back .pic.a-flicker,.front .pic.a-flicker{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,flicker 1.1s ease-in-out .6s infinite}
.card.flipped .back .pic.a-beat,.front .pic.a-beat{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,beat 1.2s ease-in-out .6s infinite}
.card.flipped .back .pic.a-spin,.front .pic.a-spin{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,spin 4s linear .6s infinite}
.card.flipped .back .pic.a-shake,.front .pic.a-shake{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,shake 1.6s ease-in-out .6s infinite}
.card.flipped .back .pic.a-wave,.front .pic.a-wave{transform-origin:70% 85%;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,wave 1.8s ease-in-out .6s infinite}
.card.flipped .back .pic.a-breathe,.front .pic.a-breathe{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both,breathe 2.8s ease-in-out .6s infinite}
@keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.08,.92)}70%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-10px)}}
@keyframes flyin{from{opacity:0;transform:translate(-90px,30px) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes hover{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-6px) rotate(-3deg)}}
@keyframes drivein{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes rumble{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes flicker{0%,100%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.08) rotate(-2deg);filter:brightness(1.25)}60%{transform:scale(.97) rotate(2deg);filter:brightness(.95)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,60%,100%{transform:translateX(0)}10%,30%,50%{transform:translateX(-5px) rotate(-4deg)}20%,40%{transform:translateX(5px) rotate(4deg)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(18deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.done .han{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.ans{transition:transform .12s ease}
.ans:active{transform:scale(.95)}
.confetti{position:fixed;top:-20px;z-index:50;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){
  .pic,.han ruby,.mean,.mover,.done .han{animation:none!important}
  .mover,.mover.snap,.mover.fly-yes,.mover.fly-no{transition:none!important}
}

</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1><span>汉语</span>Карточки HSK 3.0</h1>
    <div class="sub" id="sub"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Уровень HSK"></nav>

  <div class="bar">
    <button class="chip" id="dir" aria-pressed="false" title="Что показывать на лицевой стороне">汉字 → значение</button>
    <button class="chip" id="pyb" aria-pressed="false" title="Показывать пиньинь на лицевой стороне">拼音</button>
    <button class="chip" id="shuffle">Перемешать</button>
    <span class="spacer"></span>
    <button class="chip" id="reset">Сбросить</button>
  </div>

  <div class="prog">
    <div class="prog-row"><span id="pLeft"></span><span id="pKnown"></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="mover" id="mover">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
      <div class="stamp stamp-yes" id="stampYes" aria-hidden="true">Знаю</div>
      <div class="stamp stamp-no" id="stampNo" aria-hidden="true">Ещё раз</div>
    </div>
  </div>

  <div class="answers" id="answers">
    <button class="ans no" id="no">Ещё раз</button>
    <button class="ans yes" id="yes">Знаю</button>
  </div>
  <div class="keys"><kbd>Пробел</kbd> перевернуть · <kbd>←</kbd> ещё раз · <kbd>→</kbd> знаю</div>
</div>

function packKnown(l){
  const deck = DATA[l], bytes = new Uint8Array(Math.ceil(deck.length / 8));
  deck.forEach((w, i) => { if (known[l].has(w[3])) bytes[i >> 3] |= 1 << (i & 7); });
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s);
}
function unpackKnown(l, b64){
  const out = new Set(); if (!b64) return out;
  try { const s = atob(b64); DATA[l].forEach((w, i) => { if ((s.charCodeAt(i >> 3) >> (i & 7)) & 1) out.add(w[3]); }); } catch(e){}
  return out;
}

}
let level = store.get('hsk3.level', 1);
const hashLv = (location.hash.match(/^#hsk([1-5])$/i) || [])[1];
if (hashLv){ level = +hashLv; store.set('hsk3.level', level); }
let reverse = store.get('hsk3.reverse', false);
let pyAlways = store.get('hsk3.pyAlways', false);
let known = {};      // level -> Set of hanzi
for (let l = 1; l <= 5; l++) known[l] = new Set(store.get('hsk3.known.' + l, []));
let queue = [], current = null, flipped = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function saveKnown(){ store.set('hsk3.known.' + level, [...known[level]]); cloudSave('k' + level, packKnown(level)); }

function buildQueue(doShuffle){
  queue = DATA[level].map((w, i) => i).filter(i => !known[level].has(DATA[level][i][3]));
  if (doShuffle) shuffle(queue);
  next();
}

function renderTabs(){
  $('tabs').innerHTML = '';
  for (let l = 1; l <= 5; l++){
    const b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role','tab'); b.id = 'tab' + l;
    b.setAttribute('aria-selected', l === level);
    b.innerHTML = `<b>HSK ${l}</b><small>${known[l].size}/${DATA[l].length}</small>`;
    b.onclick = () => { level = l; store.set('hsk3.level', l); cloudPrefs(); haptic.tap(); renderTabs(); buildQueue(true); };
    $('tabs').appendChild(b);
  }
}

function rubyHTML(parts){
  let i = 0;
  return parts.map(p => p.map(([c, s, tn]) => `<ruby class="t${tn}" style="--i:${i++}">${c}<rt>${s}</rt></ruby>`).join('')).join('<span class="sep">/</span>');
}
function plainHTML(parts){ return parts.map(p => p.map(x => x[0]).join('')).join('<span class="sep">/</span>'); }
const LEGEND = `<div class="legend" aria-label="Цвета тонов"><span class="t1">ā<small>1</small></span><span class="t2">á<small>2</small></span><span class="t3">ǎ<small>3</small></span><span class="t4">à<small>4</small></span><span class="t5">a<small>лёгк.</small></span></div>`;
const ANIM = {
  bounce: '🐕🐈🐔🐟🐦🐼🐘🐒🐅🐇🐭🐍🐂🐖🐑🐎🦆🐻🐧🐉🦁🐾🦘🐢🐛🐜🦒🐋🦨🦜🏀⚽🏐🎾🏸🧒👦👧👶🤸🏃🥚🍎🍑🍐🍉🍌🧸🎉🎁🎂🥳',
  sway: '🌳🌲🌿🌱🌸🌷💐🌾🍃🍂🌵🎋🌧️⛈️🌦️🌨️☂️🪴🌹🥀❄️☃️🧣',
  float: '☁️⛅🌤️🎈🕊️💭🫧🪶👻🌙🌕🌌🛰️🌫️🧚',
  fly: '✈️🛫🛬🚀💨🌬️🏎️🦅',
  drive: '🚗🚕🚌🚙🚚🚆🚄🚇🚢🛵🚲🏍️🚣🦽🚑🚒🚶🚏',
  flicker: '🔥✨⚡💡🌟⭐🎆🧨☀️🌞🕯️🎇💥🌈🔦🌅🌇🌃',
  beat: '❤️💕💗💔💑🫀💖💌🥰😍🫂',
  spin: '🔄🌀⚙️☸️🧭🎡💿📀♻️🌍🌏🌐🎳⏳',
  shake: '😠😡🤬😤🥶🔔⏰📳📢📣🚨😱😨🤧😭🤒🤕😷',
  wave: '👋🙋🤝👏🙌✋🙏🤲'
};
function picAnim(e){
  for (const k in ANIM) if (ANIM[k].includes(e)) return 'a-' + k;
  if (/^[\u{1F600}-\u{1F64F}\u{1F910}-\u{1F92F}]/u.test(e)) return 'a-bounce';
  return 'a-breathe';
}
function hanClass(s){ return s.length >= 5 ? 'han sm' : s.length >= 3 ? 'han long' : 'han'; }
function meanHTML(m, big){ return `<div class="mean${big ? ' big' : ''}">${m}</div>`; }

function render(){
  const total = DATA[level].length, k = known[level].size;
  $('pLeft').textContent = `Осталось в колоде: ${queue.length + (current !== null ? 1 : 0)}`;
  $('pKnown').textContent = `Выучено ${k} из ${total}`;
  $('fill').style.width = (k / total * 100) + '%';
  $('sub').textContent = `Уровень ${level} · ${total} новых слов`;
  $('dir').textContent = reverse ? 'Значение → 汉字' : '汉字 → значение';
  $('dir').setAttribute('aria-pressed', reverse);
  $('pyb').setAttribute('aria-pressed', pyAlways);

  const card = $('card'), stage = $('stage');
  const old = stage.querySelector('.done'); if (old) old.remove();
  if (current === null){
    card.hidden = true;
    const d = document.createElement('div'); d.className = 'done';
    d.innerHTML = `<div class="han">完</div><strong>Все слова HSK ${level} отмечены как выученные</strong>
      <p>Перейдите на следующий уровень или сбросьте этот, чтобы повторить его заново.</p>`;
    stage.appendChild(d);
    $('no').disabled = $('yes').disabled = true;
    return;
  }
  card.hidden = false;
  $('no').disabled = $('yes').disabled = false;
  const [han, py, m0, , emo, parts] = DATA[level][current]; const m = esc(m0);
  const ruby = `<div class="${hanClass(han)}">${rubyHTML(parts)}</div>`;
  const front = pyAlways ? ruby : `<div class="${hanClass(han)}">${plainHTML(parts)}</div>`;
  const pic = emo ? `<div><span class="pic ${picAnim(emo)}" aria-hidden="true">${emo}</span></div>` : '';
  const pos = DATA[level].length - queue.length - k;
  const corner = `<div class="corner"><span>HSK ${level}</span><span>${current + 1} / ${total}</span></div>`;
  if (!reverse){
    $('front').innerHTML = corner + front + `<div class="hint">Нажмите — перевернуть · свайп ← → — ответ</div>`;
    $('back').innerHTML  = corner + pic + ruby + meanHTML(m) + LEGEND;
  } else {
    $('front').innerHTML = corner + pic + meanHTML(m, true) + `<div class="hint">Нажмите — перевернуть · свайп ← → — ответ</div>`;
    $('back').innerHTML  = corner + pic + ruby + meanHTML(m) + LEGEND;
  }
  card.classList.toggle('flipped', flipped);
}

function next(){
  flipped = false;
  $('card').classList.add('noanim');
  current = queue.length ? queue.shift() : null;
  render();
  void $('card').offsetWidth;
  $('card').classList.remove('noanim');
}
function flip(){ if (current === null) return; haptic.tap(); flipped = !flipped; $('card').classList.toggle('flipped', flipped); }
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy = false;
function stamps(dx){
  const a = Math.min(1, Math.abs(dx) / 90);
  $('stampYes').style.opacity = dx > 0 ? a : 0;
  $('stampNo').style.opacity = dx < 0 ? a : 0;
}
function answer(ok){
  if (current === null || busy) return;
  if (ok){ haptic.ok(); known[level].add(DATA[level][current][3]); saveKnown(); renderTabs(); }
  else { haptic.again(); const at = Math.min(queue.length, 4 + Math.floor(Math.random() * 4)); queue.splice(at, 0, current); }
  const mv = $('mover');
  const finish = () => {
    mv.classList.remove('fly-yes', 'fly-no', 'snap'); mv.style.transform = ''; stamps(0);
    next();
    if (current === null && ok) confetti();
    if (!reduceMotion()){ mv.classList.remove('enter'); void mv.offsetWidth; mv.classList.add('enter'); }
    busy = false;
  };
  if (reduceMotion()) return finish();
  busy = true;
  stamps(ok ? 120 : -120);
  mv.classList.add(ok ? 'fly-yes' : 'fly-no');
  setTimeout(finish, 320);
}
function confetti(){
  if (reduceMotion()) return;
  const bits = ['🎉','✨','🎊','⭐','汉','字','🧧'];
  for (let i = 0; i < 36; i++){
    const s = document.createElement('span'); s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    s.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}

// карточку можно тянуть пальцем (или мышью): вправо — «Знаю», влево — «Ещё раз»
let sx = null, sy = null, swiped = false, dragging = false, ddx = 0;
const cardEl = $('card'), mvEl = $('mover');
cardEl.addEventListener('pointerdown', e => {
  if (busy || current === null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  sx = e.clientX; sy = e.clientY; swiped = false; dragging = false; ddx = 0;
});
cardEl.addEventListener('pointermove', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!dragging){
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    dragging = true; mvEl.classList.remove('snap', 'enter');
    try { cardEl.setPointerCapture(e.pointerId); } catch(_){}
  }
  ddx = dx;
  mvEl.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  stamps(dx);
});
const endDrag = () => {
  if (sx === null) return;
  sx = null;
  if (!dragging) return;
  dragging = false; swiped = true;
  if (Math.abs(ddx) > 90) answer(ddx > 0);
  else { mvEl.classList.add('snap'); mvEl.style.transform = ''; stamps(0); setTimeout(() => mvEl.classList.remove('snap'), 320); }
};
cardEl.addEventListener('pointerup', endDrag);
cardEl.addEventListener('pointercancel', endDrag);
$('card').onclick = () => { if (swiped){ swiped = false; return; } flip(); };
$('card').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); flip(); } };
$('no').onclick = () => answer(false);
$('yes').onclick = () => answer(true);
$('shuffle').onclick = () => buildQueue(true);
$('pyb').onclick = () => { pyAlways = !pyAlways; store.set('hsk3.pyAlways', pyAlways); cloudPrefs(); render(); };
$('dir').onclick = () => { reverse = !reverse; store.set('hsk3.reverse', reverse); cloudPrefs(); flipped = false; render(); };
let resetArmed = false, resetTimer;
$('reset').onclick = () => {
  if (!resetArmed){ resetArmed = true; $('reset').textContent = 'Точно?';
    resetTimer = setTimeout(() => { resetArmed = false; $('reset').textContent = 'Сбросить'; }, 3000); return; }
  clearTimeout(resetTimer); resetArmed = false; $('reset').textContent = 'Сбросить';
  known[level].clear(); saveKnown(); renderTabs(); buildQueue(true);
};
document.addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.code === 'Space'){ e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') answer(false);
  else if (e.key === 'ArrowRight') answer(true);
});

if (inTG){
  tg.ready(); tg.expand();
  if (tgv('7.7')) tg.disableVerticalSwipes();   // свайпы по карточке не закрывают приложение
  tgTheme(); tg.onEvent('themeChanged', tgTheme);
}
renderTabs();
buildQueue(true);
if (inTG) cloudLoad(() => { renderTabs(); buildQueue(true); });
</script>

</body>
</html>
